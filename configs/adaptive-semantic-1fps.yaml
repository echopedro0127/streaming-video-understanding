# Frozen question-only routing. Same model, prompt, 1 FPS and 60s horizon.
# Includes matched Q-only allocation controls; run with --policy or --all-policies.
dataset:
  name: StreamingBench
  subset: real-time-1-100
  context_horizon_s: 60.0
  timestamp_tolerance_s: 1.0e-6
experiment:
  seed: 42
  visual_budget: 8
  policy_ids:
    - recent-8
    - recent-6+semantic-memory-2
    - recent-4+semantic-memory-4
    - recent-4+semantic-diverse-memory-4
    - adaptive-semantic-v1
model:
  backend: smolvlm
  model_id: HuggingFaceTB/SmolVLM2-500M-Video-Instruct
  max_new_tokens: 8
runtime:
  sample_fps: 1.0
  batch_size: 1
retrieval:
  model_id: openai/clip-vit-base-patch32
  device: auto
  cache_dir: .cache/semantic_features
  image_batch_size: 16
  candidate_multiplier: 4
  cluster_window_s: 3.0
  diversity_weight: 0.25
