dataset:
  name: StreamingBench
  subset: real-time-1-100
  context_horizon_s: 60.0
  timestamp_tolerance_s: 1.0e-6

experiment:
  seed: 42
  visual_budget: 8
  recent_capacity: 4
  memory_capacity: 4
  policy_ids:
    - recent-8
    - uniform-8
    - recent-4+uniform-memory-4
    - recent-4+timestamp-aware-memory-4

model:
  backend: smolvlm
  model_id: HuggingFaceTB/SmolVLM2-500M-Video-Instruct
  max_new_tokens: 8

runtime:
  sample_fps: 2.0
  batch_size: 1
